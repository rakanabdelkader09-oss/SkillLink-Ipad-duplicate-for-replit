# Codemagic CI/CD configuration for SkillLink — Kids Learning
# ------------------------------------------------------------
# Two workflows:
#   ios-unsigned-build  → unsigned .ipa (sideloadable via AltStore / Sideloadly)
#   android-debug-build → debug .apk (installable directly or open android/ in Android Studio)
#
# To point the app at your live API, set VITE_API_URL in the Codemagic
# Environment variables UI (App settings → Environment variables) rather than
# here, so the value is never committed to the repo.
#
# App metadata: SkillLink / com.skilllink.app
workflows:

  # ── iOS ─────────────────────────────────────────────────────────────────────
  ios-unsigned-build:
    name: SkillLink iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      xcode: latest
      groups:
        - skilllink
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.skilllink.app
        APP_NAME: SkillLink
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install

      - name: Build web bundle
        script: VITE_API_URL=https://skilllink-ipad-duplicate-for-replit-production.up.railway.app npm run build

      - name: Initialise & sync iOS shell
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build unsigned .app
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package unsigned IPA
        script: |
          mkdir -p build_ios/ipa/Payload
          cp -r build_ios/Build/Products/Release-iphoneos/App.app build_ios/ipa/Payload/
          (cd build_ios/ipa && zip -r SkillLink_Unsigned.ipa Payload)
    artifacts:
      - build_ios/ipa/*.ipa
      - build_ios/Build/Products/Release-iphoneos/*.app

  # ── Android ─────────────────────────────────────────────────────────────────
  android-debug-build:
    name: SkillLink Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
      groups:
        - skilllink
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install

      - name: Build web bundle
        script: VITE_API_URL=https://skilllink-ipad-duplicate-for-replit-production.up.railway.app npm run build

      - name: Initialise & sync Android shell
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
