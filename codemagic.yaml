workflows:
  ios-unsigned-build:
    name: SkillLink iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      xcode: latest
      groups:
        - skilllink
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.skilllink.app
        APP_NAME: SkillLink
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install
      - name: Build web bundle
        script: VITE_API_URL=https://skilllink-ipad-duplicate-for-replit-production.up.railway.app npm run build
      - name: Initialise & sync iOS shell
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Copy app icon
        script: |
          cp assets/appicon/Icon-*.png ios/App/App/Assets.xcassets/AppIcon.appiconset/
          cp assets/appicon/AppIcon~ios-marketing.png ios/App/App/Assets.xcassets/AppIcon.appiconset/
          cp assets/appicon/Contents.json ios/App/App/Assets.xcassets/AppIcon.appiconset/
      - name: Build unsigned .app
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""
      - name: Package unsigned IPA
        script: |
          mkdir -p build_ios/ipa/Payload
          cp -r build_ios/Build/Products/Release-iphoneos/App.app build_ios/ipa/Payload/
          (cd build_ios/ipa && zip -r SkillLink_Unsigned.ipa Payload)
    artifacts:
      - build_ios/ipa/*.ipa
      - build_ios/Build/Products/Release-iphoneos/*.app
  android-debug-build:
    name: SkillLink Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
      groups:
        - skilllink
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install
      - name: Build web bundle
        script: VITE_API_URL=https://skilllink-ipad-duplicate-for-replit-production.up.railway.app npm run build
      - name: Initialise & sync Android shell
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Copy Android icons
        script: |
          cp assets/appicon/android/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/appicon/android/mipmap-mdpi/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp assets/appicon/android/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/appicon/android/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/appicon/android/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/appicon/android/mipmap-xhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/appicon/android/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/appicon/android/mipmap-xxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/appicon/android/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/appicon/android/mipmap-xxxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk